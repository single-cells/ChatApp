services:
  postgres:
    image: postgres:latest
    environment:
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: chat
      POSTGRES_DB: chat
    ports:
      # 避免与 Windows 本机已占用的 5432 冲突
      - "5433:5432"
    volumes:
      # Postgres 18+ 需挂载到 /var/lib/postgresql（非 data 子目录）
      - pgdata:/var/lib/postgresql

  redis:
    image: redis:latest
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
